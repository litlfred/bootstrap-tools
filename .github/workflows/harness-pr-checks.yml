# bootstrap-tools's harness checks on every pull request.
#
# Owner, 2026-10-14: "There should be CI running", and ("1") through ONE
# reusable workflow the harness owns, not a copy per repository; and "A
# harnessed repo should run not just core but all of the checks in the
# dependency harness".
#
# This adds to check.yml, it does not replace it. check.yml checks the README
# regions and the README book STANDALONE, with no bootstrap beside this
# repository. That property is its whole point, and a mounted index cannot
# test it. The same scripts (readme-sections:check, readmes:check, book:check)
# also run here as gates, inside the index.
#
# The checks themselves live in cat-harness-tools
# (`.github/workflows/layer-pr-checks.yml`): bootstrap-tools swapped into the
# folio-assistant index; typecheck; its tests; and the gates of bootstrap-tools and
# its whole dependency harness, failing only on what this PR newly breaks.
name: Harness PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      instance: bootstrap-tools
      path-in-repo: .
      tools-ref: main
      # folio-assistant main pins pre-70lx layers until folio-assistant#2529 merges.
      index-ref: claude/nifty-johnson-w3mspn
